spring:
  application:
    name: vempain-mcp
  ai:
    mcp:
      server:
        name: vempain-mcp
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: native

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

vempain:
  mcp:
    client-token-hash: ${VEMPAIN_MCP_CLIENT_TOKEN_HASH:}
    admin:
      url: ${VEMPAIN_MCP_ADMIN_URL:}
      api-token: ${VEMPAIN_MCP_ADMIN_API_TOKEN:}
      certificate: ${VEMPAIN_MCP_ADMIN_CERTIFICATE:}
    file:
      url: ${VEMPAIN_MCP_FILE_URL:}
      api-token: ${VEMPAIN_MCP_FILE_API_TOKEN:}
      certificate: ${VEMPAIN_MCP_FILE_CERTIFICATE:}
    query:
      max-rows: ${VEMPAIN_MCP_QUERY_MAX_ROWS:1000}
      timeout-seconds: ${VEMPAIN_MCP_QUERY_TIMEOUT_SECONDS:30}

---
spring:
  config:
    activate:
      on-profile: local
