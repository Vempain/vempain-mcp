version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        update-types: [ minor, patch, major ]

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      weekly-dependencies:
        applies-to: version-updates
        patterns: [ "*" ]
        update-types: [ minor, patch, major ]
      security-dependencies:
        applies-to: security-updates
        patterns: [ "*" ]
