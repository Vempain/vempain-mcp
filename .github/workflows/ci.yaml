name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags: [ 'v*.*.*' ]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  ci:
    uses: Vempain/vempain-workflows/.github/workflows/spring-boot-service.yaml@main
    with:
      install_exiftool: false
      run_test_setup: false
      publish_api: false
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
