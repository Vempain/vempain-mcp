name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags: [ 'v*.*.*' ]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  ci:
    uses: Vempain/vempain-workflows/.github/workflows/spring-boot-service.yaml@main
    secrets:
      VEMPAIN_ACTION_TOKEN: ${{ secrets.VEMPAIN_ACTION_TOKEN }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
